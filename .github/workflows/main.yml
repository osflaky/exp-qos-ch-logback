name: CI

on:
  workflow_dispatch:
concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/branch_1.2.18' || github.ref == 
    'refs/heads/main' || github.ref == 'refs/heads/release' ) && 
    format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Test:
    name: JDK ${{ matrix.jdk }}, ${{ matrix.os }} [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - jdk: 21
          os: macos-latest
          expander_leg: macos-latest--arm64
      fail-fast: false
      max-parallel: 4
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    - name: Set up Java ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.jdk }}
        cache: maven  # This enables Maven dependency caching
    - name: Install
      # download dependencies, etc, so test log looks better
      run: mvn -B install


    timeout-minutes: 150
